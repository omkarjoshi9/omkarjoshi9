<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="jobdigest pipeline: job sources are collected without an LLM, hard-filtered in Python, stored and deduplicated in Postgres, scored by an LLM, then delivered as a Telegram digest with contact enrichment and Google Sheet sync.">
