<rect x="728" y="34" width="150" height="56" rx="8" fill="#161B22" stroke="#484F58" stroke-width="1.2"/><text x="803.0" y="59.0" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#E6EDF3">cloudwatch</text><text x="803.0" y="77.0" text-anchor="middle" class="mono" font-size="11" fill="#8B949E">subscription</text>
