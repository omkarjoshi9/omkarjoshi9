<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="SQL injection detection pipeline on AWS: CloudFront and WAF at the edge, ALB, ECS running OWASP Juice Shop, RDS MySQL logs streamed via CloudWatch to a Lambda detector that alerts through SNS and can block IPs in WAF.">
<title>SQL injection detection pipeline on AWS: CloudFront and WAF at the edge, ALB, ECS running OWASP Juice Shop, RDS MySQL logs streamed via CloudWatch to a Lambda detector that alerts through SNS and can block IPs in WAF.</title>
