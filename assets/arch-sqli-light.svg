<rect x="364" y="34" width="150" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/><text x="439.0" y="59.0" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#1F2328">ecs</text><text x="439.0" y="77.0" text-anchor="middle" class="mono" font-size="11" fill="#59636E">juice shop</text>
