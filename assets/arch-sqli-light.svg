<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="SQL injection detection pipeline on AWS: CloudFront and WAF at the edge, ALB, ECS running OWASP Juice Shop, RDS MySQL logs streamed via CloudWatch to a Lambda detector that alerts through SNS and can block IPs in WAF.">
<title>SQL injection detection pipeline on AWS: CloudFront and WAF at the edge, ALB, ECS running OWASP Juice Shop, RDS MySQL logs streamed via CloudWatch to a Lambda detector that alerts through SNS and can block IPs in WAF.</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/>
  </marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B26A00"/>
  </marker>
</defs>
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;} .mono{font-family:'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}
</style>
<text x="0" y="14" class="mono" font-size="11" fill="#59636E" letter-spacing="0.5">EDGE FILTERING + POST-EXECUTION DETECTION  ·  AWS</text>
