<rect x="546" y="150" width="150" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/><text x="621.0" y="175.0" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#1F2328">sns</text><text x="621.0" y="193.0" text-anchor="middle" class="mono" font-size="11" fill="#59636E">severity alert</text>
