<rect x="728" y="34" width="150" height="56" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/><text x="803.0" y="59.0" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#1F2328">cloudwatch</text><text x="803.0" y="77.0" text-anchor="middle" class="mono" font-size="11" fill="#59636E">subscription</text>
<path d="M 152 62.0 L 178 62.0" fill="none" stroke="#8C959F" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M 334 62.0 L 360 62.0" fill="none" stroke="#8C959F" stroke-width="1.4" marker-end="url(#arr)"/>
